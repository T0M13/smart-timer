start_timer:
  name: Start Timer
  description: Start a countdown timer to turn a device on or off after a duration.
  fields:
    entity_id:
      name: Entity
      description: The managed device entity.
      required: true
      selector:
        entity:
    minutes:
      name: Duration (minutes)
      description: Timer duration in minutes.
      required: true
      selector:
        number:
          min: 0.1
          max: 1440
          step: 0.1
          unit_of_measurement: min
    action:
      name: Action
      description: What to do when the timer expires.
      required: false
      default: "turn_off"
      selector:
        select:
          options:
            - "turn_on"
            - "turn_off"

cancel_timer:
  name: Cancel Timer
  description: Cancel the active timer for a device.
  fields:
    entity_id:
      name: Entity
      description: The managed device entity.
      required: true
      selector:
        entity:

add_schedule:
  name: Add Schedule
  description: Add a recurring schedule rule for a device.
  fields:
    entity_id:
      name: Entity
      description: The managed device entity.
      required: true
      selector:
        entity:
    action:
      name: Action
      description: Action to perform (turn_on or turn_off).
      required: true
      selector:
        select:
          options:
            - "turn_on"
            - "turn_off"
    time:
      name: Time
      description: Time to execute (HH:MM format).
      required: true
      selector:
        time:
    days:
      name: Days
      description: "Days of week (0=Mon, 6=Sun). Empty = every day."
      required: false
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: "0"
            - label: Tuesday
              value: "1"
            - label: Wednesday
              value: "2"
            - label: Thursday
              value: "3"
            - label: Friday
              value: "4"
            - label: Saturday
              value: "5"
            - label: Sunday
              value: "6"

remove_schedule:
  name: Remove Schedule
  description: Remove a schedule rule by ID.
  fields:
    entity_id:
      name: Entity
      description: The managed device entity.
      required: true
      selector:
        entity:
    schedule_id:
      name: Schedule ID
      description: The ID of the schedule to remove.
      required: true
      selector:
        text:

toggle_schedule:
  name: Toggle Schedule
  description: Enable or disable a schedule rule.
  fields:
    entity_id:
      name: Entity
      description: The managed device entity.
      required: true
      selector:
        entity:
    schedule_id:
      name: Schedule ID
      description: The ID of the schedule to toggle.
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      description: "Set to true/false, or omit to toggle."
      required: false
      selector:
        boolean:
